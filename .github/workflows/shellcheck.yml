name: Shellcheck

on:
  push:
    branches: [main, dev]
    paths:
      - 'labs/**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'labs/**/*.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on lab scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            d=$(dirname "$f")
            b=$(basename "$f")
            (cd "$d" && shellcheck -x -e SC2034,SC2016,SC2086 "$b")
          done < <(find labs -name '*.sh' -print0)
